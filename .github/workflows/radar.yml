name: job-radar

on:
  schedule:
    # Times are UTC. These match 8am to 11:30pm Eastern while daylight saving is on (until Nov 1).
    # Winter (after Nov 1): swap the three weekday lines for these to keep 8am to 11:30pm ET:
    #   "2,17,32,47 13-23 * * 1-5"   "2,17,32,47 0-3 * * 2-6"   "2,17,32 4 * * 2-6"
    - cron: "2,17,32,47 12-23 * * 1-5"   # weekdays every 15 min, 8am to 8pm ET
    - cron: "2,17,32,47 0-2 * * 2-6"     # weekdays every 15 min, 8pm to 11pm ET (UTC is already the next day)
    - cron: "2,17,32 3 * * 2-6"          # weekdays 11pm to 11:30pm ET
    - cron: "7 13-23/2 * * 0,6"          # weekends every 2 hours, about 9am to 7pm ET
  workflow_dispatch:
    inputs:
      mode:
        description: "run, test, validate or reset"
        type: choice
        default: run
        options: [run, test, validate, reset]

concurrency:
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: read

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
  SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
  SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  RADAR_TEX_READY_FILE: /tmp/tex-ready

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore radar memory
        if: inputs.mode != 'reset'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Check job boards
        id: radar
        run: python -m radar ${{ inputs.mode || 'run' }}

      - name: Build tailored resumes
        if: steps.radar.outputs.prep_needed == 'true'
        run: |
          ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends \
              texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern \
              > /tmp/tex-install.log 2>&1 ; touch /tmp/tex-ready ) &
          python -m radar prep

      - name: Save radar memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
