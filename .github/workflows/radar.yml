name: job-radar
run-name: ${{ inputs.mode || 'run' }} (${{ inputs.source || github.event_name }})

on:
  # The on time trigger is cron-job.org calling workflow_dispatch (docs/SCHEDULE.md): every 30 minutes,
  # 8am to 11:30pm ET on weekdays and every 2 hours on weekends, in Eastern time so daylight saving is handled.
  # These GitHub crons are only a backup. GitHub starts them late or not at all, so they run a few times a day,
  # and the guard job below skips them when the radar already ran recently.
  # Times are UTC; the hours cover 8am to 11:30pm ET both before and after daylight saving ends.
  schedule:
    - cron: "44 13,16,19,22 * * 1-5"   # weekdays, about 9am, noon, 3pm and 6pm ET
    - cron: "44 1,3 * * 2-6"           # weekday evenings, about 9pm and 11pm ET (UTC is already the next day)
    - cron: "44 15,21 * * 0,6"         # weekends, about 11am and 5pm ET
  workflow_dispatch:
    inputs:
      mode:
        description: "run, test, validate, backlog or reset"
        type: choice
        default: run
        options: [run, test, validate, backlog, reset]
      source:
        description: "Who started it (cron-job.org sets this; shown in the run name)"
        type: string
        default: manual

concurrency:  # one run at a time; a run that arrives during another waits instead of overlapping
  group: job-radar
  cancel-in-progress: false

permissions:
  contents: read

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
  GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
  NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
  SHEET_WEBHOOK_URL: ${{ secrets.SHEET_WEBHOOK_URL }}
  SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
  RADAR_TEX_READY_FILE: /tmp/tex-ready

jobs:
  guard:
    # Backup crons only: skip when cron-job.org (or anyone) ran the radar in the last 130 minutes.
    # Costs one billed minute; if the check itself fails, the radar runs anyway.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '-130 minutes' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list -R "$GITHUB_REPOSITORY" -w radar.yml -L 30 --json databaseId,displayTitle,createdAt,conclusion \
            --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID and .createdAt > \"$since\" and .conclusion != \"cancelled\"
                   and (.displayTitle | startswith(\"run \")))] | length")
          echo "Radar runs since $since: ${recent:-unknown}"
          if [ "${recent:-0}" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  radar:
    needs: guard
    if: ${{ !cancelled() && needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: Restore radar memory
        if: inputs.mode != 'reset'
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Check job boards
        id: radar
        run: python -m radar ${{ inputs.mode || 'run' }}

      - name: Build tailored resumes
        if: steps.radar.outputs.prep_needed == 'true'
        run: |
          ( sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends \
              texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended lmodern \
              > /tmp/tex-install.log 2>&1 ; touch /tmp/tex-ready ) &
          python -m radar prep

      - name: Save radar memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}-${{ github.run_attempt }}
